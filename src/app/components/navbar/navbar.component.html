<header id="navbar-principal">
  <div class="contenedor-nav">
    <a [routerLink]="['/']" class="logo">
      <img src="/images/logo_el_wey.jpg" alt="Logotipo de El Wey" width="58" height="58" />
    </a>

    <nav class="menu-enlaces">
      <a [routerLink]="['/']">Inicio</a>
      <a [routerLink]="['/comidas/tarjetas']">Menú</a>
      <a [routerLink]="['/comidas/tabla']">Tabla / CRUDs</a>
      <a [routerLink]="['/pedidos']">Pedidos</a>
      <a [routerLink]="['/admin/vertodo']">Clientes</a>
      <a [routerLink]="['/cliente/portal']">Mi Portal</a>
    </nav>

    <div class="acciones-nav">
      <a [routerLink]="['/comidas/tarjetas']" class="btn-pedido-nav">Haz Tu Pedido</a>
      @if (clienteActual) {
        <a [routerLink]="['/cliente/portal']" class="enlace-acceder-nav" title="Ir a Mi Portal">{{ clienteActual.nombre }}</a>
        <button type="button" (click)="cerrarSesion()" class="enlace-acceder-nav" style="background: none; border: none; cursor: pointer; padding: 0;" title="Cerrar sesión">Salir</button>
      } @else {
        <a [routerLink]="['/login']" class="enlace-acceder-nav">Acceder</a>
      }
    </div>
  </div>
</header>
