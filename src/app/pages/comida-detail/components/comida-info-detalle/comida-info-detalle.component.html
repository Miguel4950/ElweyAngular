<div class="col-info-detalle">
  @if (comida(); as c) {
    <div>
      <p class="subtitulo-detalle-ficha">
        Categoría: <span>{{ c.categoria ? c.categoria.nombre : 'General' }}</span>
      </p>
      <h1 class="titulo-detalle-plato">{{ c.nombre }}</h1>

      <!-- Badge especial si es la favorita de jaimes -->
      @if (c.id === 8 || c.nombre.toLowerCase().includes('jaime')) {
        <div class="badge-jaime-favorita">
          (La favorita de jaimes)
        </div>
      }

      <!-- Precio -->
      <div class="fila-precio-detalle">
        <span class="precio-grande-detalle">${{ c.precio | number:'1.0-0' }}</span>
        <span class="precio-unidad-detalle">/ Porción</span>
      </div>

      <!-- Descripción -->
      <p class="desc-completa-detalle">{{ c.descripcion }}</p>

      <!-- Adicionales Disponibles (Subcomponente fraccionado) -->
      <app-comida-adicionales
        [categoria]="c.categoria"
        (adicionalesChange)="actualizarAdicionales($event)"
      ></app-comida-adicionales>

      <!-- Selector de cantidad y botón de ordenar -->
      <div style="display: flex; align-items: center; gap: 12px; margin-top: 18px; padding: 14px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(250, 204, 21, 0.25); border-radius: 10px;">
        <label for="cantidad-input" style="font-size: 13px; font-weight: 700; color: #facc15; text-transform: uppercase;">Cantidad:</label>
        <input
          id="cantidad-input"
          type="number"
          min="1"
          max="20"
          [(ngModel)]="cantidad"
          style="width: 70px; padding: 8px 10px; border-radius: 6px; border: 1px solid #3f3f46; background: #18181b; color: #fff; font-weight: 700; text-align: center;"
        />
        <button
          type="button"
          (click)="ordenarPlato(c)"
          [disabled]="procesandoPedido"
          style="flex: 1; padding: 11px 18px; border-radius: 8px; border: none; background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; font-weight: 800; letter-spacing: 0.5px; cursor: pointer; text-transform: uppercase;"
        >
          {{ procesandoPedido ? 'Creando Pedido...' : '🛒 Ordenar este Plato Ahora' }}
        </button>
      </div>
    </div>

    <!-- Botones de Acción Inferiores -->
    <div class="footer-botones-detalle">
      <a [routerLink]="['/comidas/tarjetas']" class="btn-volver-tabla-detalle">
        &larr; Volver al Catálogo
      </a>
      <a [routerLink]="['/comidas/editar', c.id]" class="btn-editar-detalle">
        Editar este Plato
      </a>
    </div>
  }
</div>
